name: Publish tested mod release

on:
  push:
    branches: [main]
    paths:
      - "mod/**"
      - "tests/**"
      - README.md
      - manifest.json
      - release.json
      - RELEASE-NOTES-1.10.0.md
      - "docs/**"
      - tools/audit_references.json
      - tools/gen1_world_references.json
      - tools/gen2_world_references.json
      - tools/fetch_gen2_world_references.py
      - tools/fetch_gen1_world_references.py
      - tools/adaptive_native_fixture.py
      - tools/adaptive_native_references.json
      - tools/fetch_adaptive_references.py
      - tools/package_release.py
      - .github/workflows/publish-manifest-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-randomizer-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'weskestis/UniversalRandomizer'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify exact release package
        run: python3 tools/package_release.py --output dist
      - name: Install LuaJIT and fetch pinned test references
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit liblua5.4-0 love xvfb xauth python3-pil
          git clone --filter=blob:none --depth 1 --branch v0.3.99 https://github.com/bryanthaboi/gen1recomp.git dist/host
          python3 - <<'PYCODE'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path
          spec = json.loads(Path('release.json').read_text())
          commit = subprocess.check_output(['git', '-C', 'dist/host', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == spec['host_test_commit']
          url = 'https://raw.githubusercontent.com/goldenroddeptstore/untamed-tohjo/' + spec['untamed_test_commit'] + '/main.lua'
          data = urllib.request.urlopen(url, timeout=90).read()
          assert hashlib.sha256(data).hexdigest() == spec['untamed_main_sha256']
          Path('dist/untamed-main.lua').write_bytes(data)
          PYCODE
      - name: Fetch verified Gen 1 map and regression references
        run: |
          python3 tools/fetch_gen1_world_references.py
          python3 tools/fetch_gen2_world_references.py
          python3 tools/fetch_adaptive_references.py
          /usr/bin/python3 tools/adaptive_native_fixture.py --sources dist/adaptive-sources --host dist/host
      - name: Test the complete packaged mod
        env:
          MOD_SOURCE: dist/mod
          MOD_BASE: dist/mod
          HOST_SOURCE: dist/host
          UNTAMED_SOURCE: dist/untamed-main.lua
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          from pathlib import Path
          for path in Path('dist/mod').rglob('*.lua'):
              subprocess.run(['luajit', '-e', 'assert(loadfile(os.getenv("UR_LUA_SOURCE")))'], check=True, env=dict(os.environ, UR_LUA_SOURCE=str(path)))
          PYCODE
          luajit tests/features.lua
          luajit tests/progression_items.lua
          luajit tests/startup_random_start.lua
          luajit tests/native_content.lua
          luajit tests/wild_modes.lua
          luajit tests/modern_menu.lua
          luajit tests/settings_progression_audit.lua
          luajit tests/type_bias.lua
          luajit tests/gen1_world.lua
          luajit tests/gen2_world.lua
          luajit tests/gen1_release_regression.lua
          luajit tests/adaptive_gyms.lua
          luajit tests/run_tools.lua
          luajit tests/overlays.lua
          python3 tests/run_lua.py tests/features.lua tests/progression_items.lua tests/startup_random_start.lua tests/native_content.lua tests/wild_modes.lua tests/modern_menu.lua tests/settings_progression_audit.lua tests/type_bias.lua tests/gen1_world.lua tests/gen2_world.lua tests/gen1_release_regression.lua tests/adaptive_gyms.lua tests/run_tools.lua tests/overlays.lua
      - name: Render and check the actual menu
        env:
          MOD_SOURCE: dist/mod
          MOD_BASE: dist/mod
          UR_REPO: ${{ github.workspace }}
          UR_MENU_OUTPUT: ${{ github.workspace }}/dist/menu-previews
          ALSOFT_DRIVERS: "null"
        run: |
          mkdir -p dist/menu-previews
          xvfb-run -a love tests/menu_preview
          xvfb-run -a love tests/overlays_preview
      - name: Keep menu previews
        uses: actions/upload-artifact@v4
        with:
          name: randomizer-menu-previews
          path: dist/menu-previews/*.png
      - name: Update the repository ZIP
        run: |
          cp dist/universal_randomizer-1.10.0.zip UniversalRandomizer.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UniversalRandomizer.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Update packaged Universal Randomizer to 1.10.0'
            git push origin HEAD:main
          fi
      - name: Publish launcher-detectable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.10.0 >/dev/null 2>&1; then
            gh api repos/weskestis/UniversalRandomizer/releases/tags/v1.10.0 > dist/published.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('release.json').read_text())
          release = json.loads(Path('dist/published.json').read_text())
          assert not release['draft'] and not release['prerelease']
          asset = next(a for a in release['assets'] if a['name'] == 'universal_randomizer-1.10.0.zip')
          assert asset['size'] == expected['asset_size']
          assert asset['digest'] == 'sha256:' + expected['asset_sha256']
          PY
          else
            gh release create v1.10.0 \
              dist/universal_randomizer-1.10.0.zip dist/SHA256SUMS.txt \
              --target "$(git rev-parse HEAD)" \
              --title 'Universal Randomizer 1.10.0 - Run tools and adjustable overlays' \
              --notes-file dist/release-notes.md \
              --latest
          fi
      - name: Verify latest release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/weskestis/UniversalRandomizer/releases/latest > dist/latest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('release.json').read_text())
          release = json.loads(Path('dist/latest.json').read_text())
          assert release['tag_name'] == 'v1.10.0'
          assert not release['draft'] and not release['prerelease']
          asset = next(a for a in release['assets'] if a['name'] == 'universal_randomizer-1.10.0.zip')
          assert asset['size'] == expected['asset_size']
          assert asset['digest'] == 'sha256:' + expected['asset_sha256']
          print('Published and verified:', release['html_url'])
          PY
