name: Publish verified 1.8 rollback

on:
  push:
    branches: [main]
    paths:
      - "mod/**"
      - manifest.json
      - release.json
      - README.md
      - ROLLBACK-1.8.md
      - tools/package_release.py
      - .github/workflows/publish-manifest-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-randomizer-release
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'weskestis/UniversalRandomizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact 1.8 code and build launcher rollback
        run: python3 tools/package_release.py --output dist
      - name: Restore the repository download
        run: |
          cp dist/universal_randomizer-1.11.1.zip UniversalRandomizer.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UniversalRandomizer.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Restore 1.8 gameplay in the launcher rollback ZIP'
            git push origin HEAD:main
          fi
      - name: Publish the 1.8 rollback as the latest launcher update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v1.11.1 >/dev/null 2>&1; then
            gh release create v1.11.1 \
              dist/universal_randomizer-1.11.1.zip dist/SHA256SUMS.txt \
              --target "$(git rev-parse HEAD)" \
              --title 'RESTORED 1.8 BUILD - launcher rollback 1.11.1' \
              --notes-file dist/release-notes.md \
              --latest
          fi
      - name: Verify the live rollback download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/weskestis/UniversalRandomizer/releases/latest > dist/latest.json
          gh release download v1.11.1 --pattern universal_randomizer-1.11.1.zip --dir dist/live
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = json.loads(Path('release.json').read_text())
          live = json.loads(Path('dist/latest.json').read_text())
          assert live['tag_name'] == 'v1.11.1' and not live['draft'] and not live['prerelease']
          asset = next(a for a in live['assets'] if a['name'] == 'universal_randomizer-1.11.1.zip')
          assert asset['size'] == expected['asset_size']
          assert asset['digest'] == 'sha256:' + expected['asset_sha256']
          data = Path('dist/live/universal_randomizer-1.11.1.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest() == expected['asset_sha256']
          print('Published and verified the 1.8 gameplay rollback:', live['html_url'])
          PY
